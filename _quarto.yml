project:
  type: book

book:
  title: "Data Analytics for Sense-Making"
  cover-image: figs/IND5003_logo.png
  author: "Vik Gopal, Lim Tiong Wee"
  date: today
  chapters:
    - index.qmd
    - 01-intro.qmd
    - 02-inference.qmd
    - 03-unsupervised.qmd
    - 04-nlp.qmd
    - references.qmd
  cookie-consent: true
  google-analytics:
    tracking-id: "G-K3T2VC9F47"
    anonymize-ip: true

bibliography: references.bib

format:
  html:
    css: style.css
    code-tools: false
    code-line-numbers: true
    fig-align: center
    toc: true
    toc-title: Contents
    toc-depth: 2
    number-sections: true
    number-depth: 2
    theme: Yeti
  pdf: 
    documentclass: scrreprt
    papersize: a4
    fig-align: center
    lof: true
    toc: true
    toc-title: Contents
    toc-depth: 3
    number-sections: true
    number-depth: 2 
    include-in-header: 
      text: | 
        \titlehead{\includegraphics[width=6in]{figs/IND5003_logo.png}}
        \usepackage{makeidx}
        \usepackage{tocbibind}
        \makeindex
    include-after-body: 
      text: |
        \printindex
    geometry: 
      - top=20mm
      - left=20mm
      - heightrounded
    theme: Yeti

jupyter: python3
